spring.application.name=wallet-api

# Configuración de conexión a la DB (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/meliwallet
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# 'update' crea las tablas automáticamente basado en tus clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Precisión para cálculos financieros
spring.jpa.properties.hibernate.type.numeric_boolean=true